name: Aggiorna Database

on:
  schedule:
    # Ogni martedi e venerdi alle 07:00 ora italiana (06:00 UTC)
    - cron: '0 6 * * 2'
    - cron: '0 6 * * 5'
  # Permette anche esecuzione manuale dalla tab Actions su GitHub
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests pandas lxml html5lib beautifulsoup4

      - name: Esegui update_db.py
        run: python update_db.py

      - name: Esegui update_xg.py
        continue-on-error: true
        run: python update_xg.py

      - name: Commit e push aggiornamenti
        run: |
          git config --global user.name "M4 Bot"
          git config --global user.email "bot@m4analist.com"
          git add database/*_Live.csv
          git add database/xg_*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update database $(date +'%d/%m/%Y')"
          git push
